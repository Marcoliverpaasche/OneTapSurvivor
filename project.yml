name: OneTapSurvivor

options:
  bundleIdPrefix: eu.design-code
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: eu.design-code.OneTapSurvivor
    PRODUCT_MODULE_NAME: OneTapSurvivor
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SUPPORTS_MACCATALYST: "NO"
    ENABLE_BITCODE: "NO"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

targets:
  OneTapSurvivor:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: OneTapSurvivor
        excludes:
          - "**/*.md"

    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OneTapSurvivor/Info.plist
        PRODUCT_NAME: OneTapSurvivor
        PRODUCT_MODULE_NAME: OneTapSurvivor
        INFOPLIST_KEY_CFBundleDisplayName: "One Tap Survivor"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 36JKXT564H
        SWIFT_OPTIMIZATION_LEVEL[config=Debug]: "-Onone"
        SWIFT_OPTIMIZATION_LEVEL[config=Release]: "-O"
        GCC_PREPROCESSOR_DEFINITIONS[config=Debug]: "DEBUG=1 $(inherited)"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"

    entitlements:
      path: OneTapSurvivor/OneTapSurvivor.entitlements
      properties:
        com.apple.developer.game-center: true

    dependencies:
      - package: AppLovinSDK
      - package: GoogleUserMessagingPlatform
        product: UserMessagingPlatform

    capabilities:
      gameCenter:
        enabled: true

schemes:
  OneTapSurvivor:
    build:
      targets:
        OneTapSurvivor: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

packages:
  AppLovinSDK:
    url: https://github.com/AppLovin/AppLovin-MAX-Swift-Package
    from: "13.0.0"
  # Google User Messaging Platform (UMP): wird vom AppLovin-MAX-
  # Terms-&-Privacy-Flow für die GDPR-Einwilligung benötigt.
  # Nur UMP (nicht das komplette Google-Mobile-Ads-SDK) → kein
  # GADApplicationIdentifier in der Info.plist erforderlich.
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: "2.3.0"
